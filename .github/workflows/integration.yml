name: Integrated ERP checks
on:
  push:
    branches: [main, "integration/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: docker compose config --quiet
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Browser role and setup checks
        run: node frontend/tests/smoke.cjs
